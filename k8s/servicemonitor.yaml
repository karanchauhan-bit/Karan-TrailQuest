apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: karan-trailquest
  namespace: karan-trailquest
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: karan-trailquest
  namespaceSelector:
    matchNames:
      - karan-trailquest
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
